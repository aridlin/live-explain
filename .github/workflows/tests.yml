name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen
      - name: Lint and test
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      - name: Build distribution
        run: uv build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build native app and test command ledger
        run: android/gradlew -p android assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Check scanner runtime in actual APK
        run: python tools/check_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: live-explain-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
