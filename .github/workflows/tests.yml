name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen --extra native
      - name: Lint and test
        run: |
          uv run --extra native ruff check src tests
          uv run --extra native ruff format --check src tests
          uv run --extra native pytest -q
      - name: Build distribution
        run: uv build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: PYTHONPATH=src python -m unittest discover -s web_tests -v
      - run: node --test web_tests/scene.test.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build native app and test command ledger
        run: android/gradlew -p android assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain
      - name: Check controller runtime in actual APK
        run: python tools/check_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: live-explain-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
