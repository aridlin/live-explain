[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "live-explain"
version = "0.2.0"
description = "A deterministic live explanation instrument"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.10.2",
    "Pygments==2.19.2",
    "cryptography==46.0.5",
    "qrcode[pil]==8.2",
    "zeroconf==0.148.0",
]

[project.scripts]
live-explain = "live_explain.app:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
